<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Replicate Sapat Daytona transcription workflow</title>
  <desc id="desc">A four step workflow from Daytona workspace to Sapat, Replicate Whisper, and transcript output.</desc>
  <rect width="1200" height="560" fill="#f7f7f2"/>
  <rect x="70" y="90" width="240" height="170" rx="8" fill="#ffffff" stroke="#1c3d5a" stroke-width="3"/>
  <rect x="360" y="90" width="240" height="170" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="3"/>
  <rect x="650" y="90" width="240" height="170" rx="8" fill="#ffffff" stroke="#7f4f24" stroke-width="3"/>
  <rect x="940" y="90" width="190" height="170" rx="8" fill="#ffffff" stroke="#5a4fcf" stroke-width="3"/>
  <path d="M310 175h50" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M600 175h50" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M890 175h50" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>
  <text x="190" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1c3d5a">Daytona</text>
  <text x="190" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#27343f">Clean Python</text>
  <text x="190" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#27343f">workspace</text>
  <text x="480" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2d6a4f">Sapat</text>
  <text x="480" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#27343f">Video to MP3</text>
  <text x="480" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#27343f">provider CLI</text>
  <text x="770" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#7f4f24">Replicate</text>
  <text x="770" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#27343f">Whisper model</text>
  <text x="770" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#27343f">hosted API</text>
  <text x="1035" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#5a4fcf">Text</text>
  <text x="1035" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#27343f">Saved beside</text>
  <text x="1035" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#27343f">the video</text>
  <rect x="150" y="340" width="900" height="92" rx="8" fill="#e8efe9" stroke="#2d6a4f" stroke-width="2"/>
  <text x="600" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1f382d">Credentials stay in .env; media is uploaded only during the Replicate call.</text>
  <text x="600" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#27343f">Validate tests and CLI help before spending API credits on large videos.</text>
</svg>
